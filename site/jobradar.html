<style>
/* Layout: én kolonne – hoved med periodevælger og tal, filterlinje, tabel (kort på mobil), kildestatus nederst. */
:root {
  --bg: #f5f7f8;
  --surface: #ffffff;
  --fg: #16232a;
  --muted: #5b6b73;
  --line: #dde4e7;
  --accent: #0b5d6b;
  --accent-soft: #e2f0f2;
  --ok: #2f7d4f;
  --warn: #a2631a;
  --bad: #b23a3a;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1619; --surface: #162126; --fg: #e3ecef; --muted: #93a5ad; --line: #26353b;
    --accent: #63c3d1; --accent-soft: #173238; --ok: #6cc28f; --warn: #e0a65a; --bad: #ec8080;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1619; --surface: #162126; --fg: #e3ecef; --muted: #93a5ad; --line: #26353b;
  --accent: #63c3d1; --accent-soft: #173238; --ok: #6cc28f; --warn: #e0a65a; --bad: #ec8080;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 65ch; }
.lede b { color: var(--fg); font-weight: 600; }

.periods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.period {
  font: inherit; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; display: grid; gap: 2px;
}
.period .n { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.period .l { font-size: 13px; color: var(--muted); }
.period[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.period[aria-pressed="true"] .n { color: var(--accent); }
.period:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.filters input, .filters select {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
}
.filters input { flex: 1 1 220px; }
.filters select { flex: 0 1 200px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 13px; cursor: pointer;
  background: transparent; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
}
.chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.title a { color: var(--fg); font-weight: 600; text-decoration: none; }
td.title a:hover { color: var(--accent); text-decoration: underline; }
td.title .loc { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.cc { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
td.date { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.date .new { color: var(--accent); font-weight: 500; }
td.date .est { color: var(--muted); }
td.open a { color: var(--accent); white-space: nowrap; text-decoration: none; font-weight: 500; }
td.open a:hover { text-decoration: underline; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }

.status { display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
.status summary { cursor: pointer; color: var(--fg); }
.status ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.foot { font-size: 13px; color: var(--muted); }

@media (max-width: 640px) {
  .periods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  table, thead, tbody, tr, td { display: block; }
  thead { display: none; }
  tr { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; }
  td.title { grid-column: 1 / -1; }
  td.company { grid-column: 1; }
  td.country { grid-column: 2; grid-row: 2; justify-self: end; }
  td.date { grid-column: 1; }
  td.open { grid-column: 2; justify-self: end; }
}
@media (prefers-reduced-motion: no-preference) { .period, .chip { transition: background .15s, border-color .15s; } }
</style>

  var NAMES = { DK: "Danmark", SE: "Sverige", FI: "Finland", DE: "Tyskland", GB: "Storbritannien", CH: "Schweiz" };
  var LABEL = { GB: "UK" };
  var MONTHS = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];

  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dayNum(s) { var p = s.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
  var TODAY = dayNum(todayStr());
  function jobDate(j) {

    if (j.first_seen && j.date_basis !== "baseline") return j.first_seen.slice(0, 10);

    var tb = document.getElementById("rows"); tb.textContent = "";
