  --ink-soft: #eef2f8;
  --ok: #2f7d4f;
  --warn: #b26a12;
  --bad: #b71414;
  --on-ink: #ffffff;
  --shape: #052350;        /* hero-femkant og tabelhoved */
  --on-shape: #ffffff;
  --font-display: "Kanit", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Questrial", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --radius: 9px;
}
@media (prefers-color-scheme: dark) {

    --bg: #04142e; --band: #071d40; --surface: #0a2450; --fg: #e6ebf3; --ink: #ffffff; --muted: #a2afc4; --line: #1b3765;
    --red: #ff6b63; --teal: #3fd3e3; --teal-text: #5fd9e7; --ink-soft: #12336a; --ok: #6cc28f; --warn: #e6a95a; --bad: #ff6b63;
    --on-ink: #052350; --shape: #0f3270; --on-shape: #ffffff;

  }
}
:root[data-theme="dark"] {
  --bg: #04142e; --band: #071d40; --surface: #0a2450; --fg: #e6ebf3; --ink: #ffffff; --muted: #a2afc4; --line: #1b3765;
  --red: #ff6b63; --teal: #3fd3e3; --teal-text: #5fd9e7; --ink-soft: #12336a; --ok: #6cc28f; --warn: #e6a95a; --bad: #ff6b63;

.hero .inner { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; gap: 24px; padding-block: 44px 40px; }

.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--on-ink); border-color: var(--ink); background: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; overflow: hidden; }
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }

    });
    var empty = document.getElementById("empty");
    var table = document.querySelector("table");
    if (!DATA.generated_at) {
      empty.innerHTML = "<strong>Ingen data endnu</strong>Radaren fyldes, når scraperen har kørt første gang på GitHub.";
      empty.hidden = false; table.hidden = true;
    } else if (!list.length) {
      var label = state.days === 0 ? "i dag" : state.days === "all" ? "lige nu" : "de seneste " + state.days + " dage";
      empty.innerHTML = "<strong>Ingen nye stillinger " + label + "</strong>Prøv en længere periode, eller ryd søgning og filtre.";
      empty.hidden = false; table.hidden = true;
    } else { empty.hidden = true; table.hidden = false; }
    try { localStorage.setItem("hrisradar-days", String(state.days)); } catch (e) {}
  }

  document.querySelectorAll(".period").forEach(function (b) {
    b.addEventListener("click", function () { state.days = b.dataset.days === "all" ? "all" : +b.dataset.days; render(); });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); render(); });
  sel.addEventListener("change", function (e) { state.company = e.target.value; render(); });

  // Kildestatus og hvad der ikke er dækket
  var st = document.getElementById("status");
  var src = DATA.sources || [];
  if (src.length) {
    var bad = src.filter(function (s) { return !s.ok; });
    var det = document.createElement("details");
    var sum = document.createElement("summary");
    sum.innerHTML = '<span class="dot ' + (bad.length ? "warn" : "ok") + '"></span>' + (src.length - bad.length) + " af " + src.length + " kilder svarede ved seneste kørsel";
    det.appendChild(sum);
    var ul = document.createElement("ul");
    src.forEach(function (s) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="dot ' + (s.ok ? "ok" : "bad") + '"></span>';
      li.appendChild(document.createTextNode(s.company + (s.label ? " (" + s.label + ")" : "") + (s.ok ? " – " + (s.matched || 0) + " match" : " – fejl: " + (s.error || "ukendt"))));
      ul.appendChild(li);
    });
    det.appendChild(ul); st.appendChild(det);
  }
  (DATA.not_covered || []).forEach(function (n) {
    var p = document.createElement("div");
    p.innerHTML = '<span class="dot bad"></span>';
    p.appendChild(document.createTextNode("Ikke dækket: " + n.company + " " + n.scope + " – " + n.reason + "."));
    st.appendChild(p);
  });
  var foot = document.getElementById("foot");
  foot.textContent = DATA.generated_at
    ? "Data opdateret " + new Date(DATA.generated_at).toLocaleString("da-DK", { dateStyle: "long", timeStyle: "short" }) + ". Dato er opslagets egen dato; mangler den, vises dagen radaren første gang så stillingen."
    : "Opdateres automatisk hver morgen.";
  render();
})();
</script>
